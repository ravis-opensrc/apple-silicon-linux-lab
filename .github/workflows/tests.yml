name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n bin/* scripts/*.sh
      - run: sh -n scripts/guest-init.sh
      - run: python3 -B -m unittest discover -s tests -v
